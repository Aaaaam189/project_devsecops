spring:
  application:
    name: auth-service
  config:
    import: "optional:configserver:http://config-server:8888"

server:
  port: 8081

management:
  health:
    mail:
      enabled: false
    # The mail indicator tries to open an SMTP connection to smtp.gmail.com
    # on every /actuator/health call. In local/dev MAIL_USERNAME and
    # MAIL_PASSWORD are empty, so that connection always fails and the
    # whole health endpoint reports 503 even though the app is healthy.
    # Password-reset emails are not required for login/register/profile
    # flows, so mail is excluded from the readiness signal.
