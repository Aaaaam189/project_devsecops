apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: foundersync-gateway
  namespace: foundersync
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "*"
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: foundersync
  namespace: foundersync
spec:
  hosts:
    - "*"
  gateways:
    - foundersync-gateway
  http:
    - match:
        - uri:
            prefix: /socket.io
      route:
        - destination:
            host: api-gateway
            port:
              number: 8080
    - match:
        - uri:
            prefix: /api
      route:
        - destination:
            host: api-gateway
            port:
              number: 8080
    - route:
        - destination:
            host: frontend
            port:
              number: 3000
