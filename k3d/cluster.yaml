
apiVersion: k3d.io/v1alpha5
kind: Simple

metadata:
  name: foundersync

servers: 1
agents: 0

# Kubernetes API endpoint on my Windows host
kubeAPI:
  host: "127.0.0.1"
  hostIP: "127.0.0.1"
  hostPort: "6550"

# load balancer and port forwarding
ports:
  - port: 8080:80
    nodeFilters:
      - loadbalancer

options:
  k3s:
    extraArgs:
      - arg: --disable=metrics-server
        nodeFilters:
          - server:*
