apiVersion: v1
kind: ConfigMap
metadata:
  name: mongodb-init
  labels:
    app.kubernetes.io/part-of: foundersync
data:
  init-mongodb.sh: |
    #!/bin/sh
    set -eu
    mongosh --quiet "mongodb://$MONGO_INITDB_ROOT_USERNAME:$MONGO_INITDB_ROOT_PASSWORD@127.0.0.1:27017/admin" \
      --eval 'const d=db.getSiblingDB("chatdb"); if(!d.getUser(process.env.MONGO_CHAT_USER)){d.createUser({user:process.env.MONGO_CHAT_USER,pwd:process.env.MONGO_CHAT_PASSWORD,roles:[{role:"readWrite",db:"chatdb"}]});}'
