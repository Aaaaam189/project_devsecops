# startup-service — Spring Boot, Postgres (startup_db) + RabbitMQ.
# No JWT_SECRET env in docker-compose.yml for this service, so none
# referenced here either.

nameOverride: startup-service

image:
  repository: startup-service
  tag: latest

service:
  port: 8083
  targetPort: 8083

healthPath: /actuator/health

env:
  SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/startup_db"
  SPRING_RABBITMQ_HOST: "rabbitmq"
  AWS_ACCESS_KEY: "dummy-access-key"
  AWS_SECRET_KEY: "dummy-secret-key"
  AWS_BUCKET_NAME: "founderssync-uploads"

envFromSecret:
  SPRING_DATASOURCE_USERNAME:
    secretName: postgres-app-credentials
    secretKey: username
  SPRING_DATASOURCE_PASSWORD:
    secretName: postgres-app-credentials
    secretKey: password
  DB_USERNAME:
    secretName: postgres-app-credentials
    secretKey: username
  DB_PASSWORD:
    secretName: postgres-app-credentials
    secretKey: password

resources:
  requests:
    cpu: 150m
    memory: 384Mi
  limits:
    memory: 640Mi
