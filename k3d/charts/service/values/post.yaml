# post-service — Spring Boot, Postgres (post_service_db) + RabbitMQ,
# also calls user-service directly (USER_SERVICE_URL). No JWT_SECRET
# env in docker-compose.yml for this service.

nameOverride: post-service

image:
  repository: post-service
  tag: latest

service:
  port: 8084
  targetPort: 8084

healthPath: /actuator/health

env:
  SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/post_service_db"
  SPRING_RABBITMQ_HOST: "rabbitmq"
  SPRING_RABBITMQ_PORT: "5671"
  SPRING_RABBITMQ_SSL_ENABLED: "true"
  SPRING_RABBITMQ_VIRTUAL_HOST: "/foundersync"
  AWS_ACCESS_KEY: "dummy-access-key"
  AWS_SECRET_KEY: "dummy-secret-key"
  AWS_BUCKET_NAME: "founderssync-uploads"
  USER_SERVICE_URL: "http://user-service:8082"

envFromSecret:
  SPRING_DATASOURCE_USERNAME:
    secretName: postgres-app-credentials
    secretKey: username
  SPRING_DATASOURCE_PASSWORD:
    secretName: postgres-app-credentials
    secretKey: password
  DB_USERNAME:
    secretName: postgres-app-credentials
    secretKey: username
  DB_PASSWORD:
    secretName: postgres-app-credentials
    secretKey: password
  SPRING_RABBITMQ_USERNAME:
    secretName: rabbitmq-app-credentials
    secretKey: username
  SPRING_RABBITMQ_PASSWORD:
    secretName: rabbitmq-app-credentials
    secretKey: password
  JWT_SECRET:
    secretName: jwt-secret
    secretKey: secret

resources:
  requests:
    cpu: 150m
    memory: 384Mi
  limits:
    memory: 640Mi
