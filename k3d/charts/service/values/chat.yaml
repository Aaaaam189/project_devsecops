# chat-service — odd one out #1: Node.js (not Spring Boot), MongoDB
# instead of Postgres, its own health path (/health, not
# /actuator/health), and much lighter resource needs than the JVM
# services. JWT_SECRET here is for verifying tokens issued by
# auth-service (same shared secret, same jwt-secret placeholder
# caveat as auth.yaml/user.yaml).
#
# The Node.js chat service receives RabbitMQ username/password from
# rabbitmq-app-credentials and constructs its AMQP URL at runtime.

nameOverride: chat-service

image:
  repository: chat-service
  tag: latest

service:
  port: 8085
  targetPort: 8085

healthPath: /health

env:
  PORT: "8085"
  MONGO_HOST: "mongodb"
  MONGO_PORT: "27017"
  MONGO_DATABASE: "chatdb"
  RABBITMQ_HOST: "rabbitmq"
  RABBITMQ_PORT: "5671"
  RABBITMQ_PROTOCOL: "amqps"
  RABBITMQ_CA_FILE: "/etc/rabbitmq-ca/ca.crt"
  RABBITMQ_VIRTUAL_HOST: "/foundersync"
  AWS_REGION: "eu-west-3"
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  AWS_BUCKET_NAME: ""
  USER_SERVICE_URL: "http://user-service:8082"

envFromSecret:
  RABBITMQ_USERNAME:
    secretName: rabbitmq-app-credentials
    secretKey: username
  RABBITMQ_PASSWORD:
    secretName: rabbitmq-app-credentials
    secretKey: password
  MONGO_USERNAME:
    secretName: mongodb-chat-credentials
    secretKey: username
  MONGO_PASSWORD:
    secretName: mongodb-chat-credentials
    secretKey: password
  JWT_SECRET:
    secretName: jwt-secret
    secretKey: secret

# The CA that signed the broker's certificate, so chat-service can verify
# it. rabbitmq.js reads RABBITMQ_CA_FILE and refuses to connect over amqps
# without it.
extraSecretMounts:
  - name: rabbitmq-ca
    secretName: rabbitmq-ca
    mountPath: /etc/rabbitmq-ca

# Node, single process, no JVM heap overhead — much lighter than the
# Spring Boot services.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi
