# api-gateway — Spring Cloud Gateway, routes to all 6 backend services.
# CORS_ALLOWED_ORIGINS still points at the docker-compose localhost
# ports; step 7 (ingress) will need to revisit this once the frontend
# is reached through the ingress host instead of localhost:3001.

nameOverride: api-gateway

image:
  repository: api-gateway
  tag: latest

service:
  port: 8080
  targetPort: 8080

healthPath: /actuator/health

env:
  SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888"
  AUTH_SERVICE_URL: "http://auth-service:8081"
  USER_SERVICE_URL: "http://user-service:8082"
  STARTUP_SERVICE_URL: "http://startup-service:8083"
  POST_SERVICE_URL: "http://post-service:8084"
  CHAT_SERVICE_URL: "http://chat-service:8085"
  NOTIFICATION_SERVICE_URL: "http://notification-service:8086"
  CORS_ALLOWED_ORIGINS: "http://localhost:8080,http://localhost:3000,http://localhost:3001,http://localhost:4200"

envFromSecret: {}

resources:
  requests:
    cpu: 150m
    memory: 384Mi
  limits:
    memory: 640Mi
