# user-service — Spring Boot, Postgres (users_db) + RabbitMQ + S3-style
# upload. Same jwt-secret placeholder caveat as auth.yaml.

nameOverride: user-service

image:
  repository: user-service
  tag: latest

service:
  port: 8082
  targetPort: 8082

healthPath: /actuator/health

env:
  SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/users_db"
  SPRING_RABBITMQ_HOST: "rabbitmq"
  SPRING_RABBITMQ_PORT: "5671"
  SPRING_RABBITMQ_SSL_ENABLED: "true"
  SPRING_RABBITMQ_VIRTUAL_HOST: "/foundersync"
  AWS_ACCESS_KEY: "dummy-access-key"
  AWS_SECRET_KEY: "dummy-secret-key"
  AWS_BUCKET_NAME: "founderssync-uploads"

envFromSecret:
  SPRING_DATASOURCE_USERNAME:
    secretName: postgres-app-credentials
    secretKey: username
  SPRING_DATASOURCE_PASSWORD:
    secretName: postgres-app-credentials
    secretKey: password
  DB_USERNAME:
    secretName: postgres-app-credentials
    secretKey: username
  DB_PASSWORD:
    secretName: postgres-app-credentials
    secretKey: password
  JWT_SECRET:
    secretName: jwt-secret
    secretKey: secret
  SPRING_RABBITMQ_USERNAME:
    secretName: rabbitmq-app-credentials
    secretKey: username
  SPRING_RABBITMQ_PASSWORD:
    secretName: rabbitmq-app-credentials
    secretKey: password

resources:
  requests:
    cpu: 150m
    memory: 384Mi
  limits:
    memory: 640Mi
