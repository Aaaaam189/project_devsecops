# notification-service — Spring Boot, Postgres (notification_service_db)
# + RabbitMQ. No JWT_SECRET, no AWS env in docker-compose.yml for this
# service.

nameOverride: notification-service

image:
  repository: notification-service
  tag: latest

service:
  port: 8086
  targetPort: 8086

healthPath: /actuator/health

env:
  SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/notification_service_db"
  SPRING_RABBITMQ_HOST: "rabbitmq"

envFromSecret:
  SPRING_DATASOURCE_USERNAME:
    secretName: postgres-credentials
    secretKey: username
  SPRING_DATASOURCE_PASSWORD:
    secretName: postgres-credentials
    secretKey: password
  DB_USERNAME:
    secretName: postgres-credentials
    secretKey: username
  DB_PASSWORD:
    secretName: postgres-credentials
    secretKey: password

resources:
  requests:
    cpu: 150m
    memory: 384Mi
  limits:
    memory: 640Mi
