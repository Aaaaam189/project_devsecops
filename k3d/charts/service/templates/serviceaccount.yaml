{{/*
One ServiceAccount per release, named after the release. Istio
AuthorizationPolicies (Phase 3, step 6) identify a caller by its
ServiceAccount, written cluster.local/ns/<namespace>/sa/<name>, so every
service needs its own instead of sharing "default".
*/}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "service.name" . }}
  labels:
    {{- include "service.labels" . | nindent 4 }}
{{- end }}
