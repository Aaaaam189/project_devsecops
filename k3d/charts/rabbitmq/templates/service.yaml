apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}
  labels:
    app.kubernetes.io/part-of: foundersync
spec:
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    {{- if .Values.tls.enabled }}
    - name: amqps
      port: 5671
      targetPort: 5671
    {{- end }}
    - name: management
      port: 15672
      targetPort: 15672