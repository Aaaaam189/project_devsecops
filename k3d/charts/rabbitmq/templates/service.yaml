apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}
  labels:
    app.kubernetes.io/part-of: foundersync
spec:
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}
  ports:
    {{- if .Values.tls.enabled }}
    - name: amqps
      port: 5671
      targetPort: 5671
    {{- end }}
    # No management port (15672): the HTTP admin UI and API are not exposed.
    # Reach it only on demand: kubectl port-forward deploy/rabbitmq 15672:15672.