apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  labels:
    app.kubernetes.io/part-of: foundersync
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/part-of: foundersync
    spec:
      containers:
        - name: rabbitmq
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.adminCredentialsSecret }}
                  key: username
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.adminCredentialsSecret }}
                  key: password
            - name: RABBITMQ_APP_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.appCredentialsSecret }}
                  key: username
            - name: RABBITMQ_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.appCredentialsSecret }}
                  key: password
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    for i in $(seq 1 30); do
                      rabbitmq-diagnostics -q ping >/dev/null 2>&1 && break
                      sleep 2
                    done
                    rabbitmqctl add_vhost /foundersync >/dev/null 2>&1 || true
                    if rabbitmqctl list_users | awk '{print $1}' | grep -qx "$RABBITMQ_APP_USER"; then
                      rabbitmqctl change_password "$RABBITMQ_APP_USER" "$RABBITMQ_APP_PASSWORD"
                    else
                      rabbitmqctl add_user "$RABBITMQ_APP_USER" "$RABBITMQ_APP_PASSWORD"
                    fi
                    rabbitmqctl set_permissions -p /foundersync "$RABBITMQ_APP_USER" ".*" ".*" ".*"
          startupProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 30

          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "check_running"]
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3

          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
            # With a startup probe in place, readiness and liveness don’t need initialDelaySeconds,
            # because they only begin once startup succeeds
          resources:
            {{- toYaml .Values.resources | nindent 12 }}