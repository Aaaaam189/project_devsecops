image:
  repository: rabbitmq
  tag: 3-management-alpine

credentialsSecret: rabbitmq-admin-credentials
adminCredentialsSecret: rabbitmq-admin-credentials
appCredentialsSecret: rabbitmq-app-credentials

tls:
  enabled: true
  secretName: rabbitmq-tls

resources:
  requests:
    cpu: 100m
    memory: 192Mi
  limits:
    memory: 512Mi