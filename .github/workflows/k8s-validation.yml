name: Kubernetes Validation

on:
  push:
    branches: [main, phase2]
    paths:
      - 'k3d/**'
      - '.github/workflows/k8s-validation.yml'
  pull_request:
    paths:
      - 'k3d/**'
      - '.github/workflows/k8s-validation.yml'

jobs:
  helm-lint:
    name: Lint Helm Charts
    runs-on: ubuntu-latest
    strategy:
      matrix:
        chart:
          - postgres
          - rabbitmq
          - mongodb
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'
      
      - name: Lint Helm chart
        run: helm lint ./k3d/charts/${{ matrix.chart }}
      
      - name: Validate Helm template rendering
        run: |
          helm template test-release ./k3d/charts/${{ matrix.chart }} \
            --debug \
            --dry-run

  helm-lint-service:
    name: Lint Shared Service Chart (per service)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - config-server
          - api-gateway
          - auth
          - user
          - startup
          - post
          - notification
          - chat
          - frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Lint service chart with ${{ matrix.service }} values
        run: |
          helm lint ./k3d/charts/service \
            -f ./k3d/charts/service/values/${{ matrix.service }}.yaml \
            --strict

      - name: Validate Helm template rendering
        run: |
          helm template ${{ matrix.service }} ./k3d/charts/service \
            -f ./k3d/charts/service/values/${{ matrix.service }}.yaml \
            --debug \
            --dry-run

  k8s-manifests:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.29.0'
      
      - name: Validate K8s manifests
        run: |
          if [ -d "k3d/manifests" ]; then
            kubectl apply --dry-run=client -f k3d/manifests/
          else
            echo "No manifests directory found, skipping"
          fi

      - name: Validate with kubeval (optional)
        run: |
          # NOTE: instrumenta/kubeval is an archived/unmaintained repo
          # and its "latest" release asset download returns a 404
          # ("Not Found") as of this writing — confirmed by actually
          # running this exact download command. This step has
          # continue-on-error: true, which is why it was silently
          # no-op-ing instead of failing the job. Left as-is
          # (untouched, not my chart) rather than fixed here — flag
          # for Member A since it's her step.
          wget https://github.com/instrumenta/kubeval/releases/latest/download/kubeval-linux-amd64.tar.gz
          tar xf kubeval-linux-amd64.tar.gz
          chmod +x kubeval
          
          if [ -d "k3d/manifests" ]; then
            ./kubeval k3d/manifests/*.yaml
          fi
        continue-on-error: true

      - name: Validate ingress manifest with kubeconform
        run: |
          # kubeconform (yannh/kubeconform) is kubeval's maintained
          # successor — same idea (validate YAML against the
          # Kubernetes OpenAPI schema with zero live cluster
          # required), but its releases actually exist. This is a
          # real, non-optional check (no continue-on-error) since
          # unlike the step above, it's confirmed working.
          if [ -f "k3d/ingress.yaml" ]; then
            curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz -o kubeconform.tar.gz
            tar xf kubeconform.tar.gz kubeconform
            ./kubeconform -summary k3d/ingress.yaml
          else
            echo "No k3d/ingress.yaml found, skipping"
          fi

  security-scan-helm:
    name: Security Scan Helm Charts
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Trivy on Helm charts
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: k3d/charts
          format: table
          severity: HIGH,CRITICAL
          exit-code: 0
