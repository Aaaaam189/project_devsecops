name: Kubernetes Validation

on:
  push:
    branches: [main, phase2]
    paths:
      - 'k3d/**'
      - '.github/workflows/k8s-validation.yml'
  pull_request:
    paths:
      - 'k3d/**'
      - '.github/workflows/k8s-validation.yml'

jobs:
  helm-lint:
    name: Lint Helm Charts
    runs-on: ubuntu-latest
    strategy:
      matrix:
        chart:
          - postgres
          - rabbitmq
          - mongodb
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'
      
      - name: Lint Helm chart
        run: helm lint ./k3d/charts/${{ matrix.chart }}
      
      - name: Validate Helm template rendering
        run: |
          helm template test-release ./k3d/charts/${{ matrix.chart }} \
            --debug \
            --dry-run

  helm-lint-service:
    name: Lint Shared Service Chart (per service)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - config-server
          - api-gateway
          - auth
          - user
          - startup
          - post
          - notification
          - chat
          - frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Lint service chart with ${{ matrix.service }} values
        run: |
          helm lint ./k3d/charts/service \
            -f ./k3d/charts/service/values/${{ matrix.service }}.yaml \
            --strict

      - name: Validate Helm template rendering
        run: |
          helm template ${{ matrix.service }} ./k3d/charts/service \
            -f ./k3d/charts/service/values/${{ matrix.service }}.yaml \
            --debug \
            --dry-run

  k8s-manifests:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.29.0'
      
      - name: Validate K8s manifests
        run: |
          if [ -d "k3d/manifests" ]; then
            kubectl apply --dry-run=client -f k3d/manifests/
          else
            echo "No manifests directory found, skipping"
          fi

      - name: Validate ingress manifest
        run: |
          # --validate=false: dry-run=client still tries to fetch the
          # live cluster's OpenAPI schema for validation by default,
          # which fails outright in CI since no cluster exists here
          # (same latent issue as the k3d/manifests branch above --
          # it just never ran until this step existed). This keeps
          # the check to local YAML/structural validation only.
          if [ -f "k3d/ingress.yaml" ]; then
            kubectl apply --dry-run=client --validate=false -f k3d/ingress.yaml
          else
            echo "No k3d/ingress.yaml found, skipping"
          fi

      - name: Validate with kubeval (optional)
        run: |
          wget https://github.com/instrumenta/kubeval/releases/latest/download/kubeval-linux-amd64.tar.gz
          tar xf kubeval-linux-amd64.tar.gz
          chmod +x kubeval
          
          if [ -d "k3d/manifests" ]; then
            ./kubeval k3d/manifests/*.yaml
          fi
        continue-on-error: true

  security-scan-helm:
    name: Security Scan Helm Charts
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Trivy on Helm charts
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: k3d/charts
          format: table
          severity: HIGH,CRITICAL
          exit-code: 0
