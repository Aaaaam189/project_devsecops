name: Build and Push Images

on:
  push:
    branches:
      - main
      - phase1
      - test1
  pull_request:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # Lowercase the repo owner/name once, share it with every matrix job.
  # GHCR rejects uppercase in image paths, and github.repository preserves
  # whatever casing the GitHub org/user/repo actually has.
  prep:
    name: Resolve lowercase image namespace
    runs-on: ubuntu-latest
    outputs:
      image-base: ${{ steps.lowercase.outputs.image-base }}
    steps:
      - name: Lowercase repository path
        id: lowercase
        run: echo "image-base=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
        env:
          REGISTRY: ${{ env.REGISTRY }}

  build:
    name: Build, scan, push (${{ matrix.name }})
    needs: prep
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # STEP 1 OF THE ROLLOUT: only auth-service is enabled while we
          # validate the pipeline end to end. The other 8 are listed but
          # commented out — uncomment once auth-service goes green.
          - name: auth-service
            context: services/auth-service
            dockerfile: services/auth-service/Dockerfile
          # - name: user-service
          #   context: services/user-service
          #   dockerfile: services/user-service/Dockerfile
          # - name: startup-service
          #   context: services/startup-service
          #   dockerfile: services/startup-service/Dockerfile
          # - name: post-service
          #   context: services/post-service
          #   dockerfile: services/post-service/Dockerfile
          # - name: notification-service
          #   context: services/notification-service
          #   dockerfile: services/notification-service/Dockerfile
          # - name: chat-service
          #   context: services/chat-service
          #   dockerfile: services/chat-service/Dockerfile
          # - name: frontend
          #   context: frontend
          #   dockerfile: frontend/Dockerfile
          # - name: api-gateway
          #   context: infrastructure/api-gateway
          #   dockerfile: infrastructure/api-gateway/Dockerfile
          # - name: config-server
          #   context: infrastructure/config-server
          #   dockerfile: infrastructure/config-server/Dockerfile

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build only — no push yet. The image stays local to this runner so
      # Trivy can scan it before anything reaches GHCR. GHA cache (below)
      # means the later "Push image to GHCR" step reuses these layers
      # instead of rebuilding from scratch, so this is effectively one
      # real build even though build-push-action is invoked twice.
      - name: Build image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          # frontend needs these three; harmless no-ops for every other
          # service since unused build-args are simply ignored.
          build-args: |
            NEXT_PUBLIC_HOST_GATEWAY_API_URL=http://localhost:8080
            NEXT_PUBLIC_SERVER_URL=http://localhost:8080
            NEXT_PUBLIC_ASSET_URL=http://localhost:8080
          push: false
          load: true
          tags: local/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # Report mode only: exit-code 0 means a failed scan never blocks the
      # build or the push. TODO (phase 6): switch exit-code to 1 and set
      # severity to HIGH,CRITICAL once the team is ready to act on findings
      # instead of just reading them.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: local/${{ matrix.name }}:${{ github.sha }}
          format: table
          exit-code: '0'
          severity: 'HIGH,CRITICAL'

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ needs.prep.outputs.image-base }}-${{ matrix.name }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      # Pushes only on main. On phase1/test1 this step still runs the Build
      # image step above and still scans, it just never publishes, matching
      # "push images only from main" in the plan. Reuses the GHA cache from
      # the build above, so this is a re-tag/push of the same layers, not a
      # second real build — the plan's "build, scan, then push" in one pass.
      - name: Push image to GHCR
        if: github.ref == 'refs/heads/main'
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: |
            NEXT_PUBLIC_HOST_GATEWAY_API_URL=http://localhost:8080
            NEXT_PUBLIC_SERVER_URL=http://localhost:8080
            NEXT_PUBLIC_ASSET_URL=http://localhost:8080
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # Step 11 deploys by digest, not by tag, so the digest has to survive
      # as a real artifact of this run, not just a log line.
      - name: Record image digest
        if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ matrix.name }} digest: ${{ steps.push.outputs.digest }}"
          mkdir -p digests
          echo "${{ steps.push.outputs.digest }}" > digests/${{ matrix.name }}.digest

      - name: Upload digest artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.name }}
          path: digests/${{ matrix.name }}.digest
          retention-days: 90
