
name: CI

on:
  pull_request:
  push:
    branches:
      - phase1

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-validation:
    name: Validate Compose configuration
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose file
        run: docker compose config --quiet

  java-tests:
    name: Test ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: auth-service
            path: services/auth-service
          - name: user-service
            path: services/user-service
          - name: startup-service
            path: services/startup-service
          - name: post-service
            path: services/post-service
          - name: notification-service
            path: services/notification-service
          - name: api-gateway
            path: infrastructure/api-gateway
          - name: config-server
            path: infrastructure/config-server

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: ${{ matrix.path }}/pom.xml

      - name: Run Maven tests
        working-directory: ${{ matrix.path }}
        run: bash ./mvnw --batch-mode test

  frontend-checks:
    name: Check frontend
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Check TypeScript
        working-directory: frontend
        run: npm run type-check

      - name: Check formatting
        working-directory: frontend
        run: npm run fm:check

  chat-service-checks:
    name: Check chat-service dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: services/chat-service/package-lock.json

      - name: Install chat-service dependencies
        working-directory: services/chat-service
        run: npm ci

      - name: Run chat-service tests when available
        working-directory: services/chat-service
        run: npm run test --if-present
