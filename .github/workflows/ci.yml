
name: CI

on:
  pull_request:
  push:
    branches:
      - phase1
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-validation:
    name: Validate Compose configuration
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose file
        env:
          MONGO_ADMIN_PASSWORD: ci-mongodb-password
          RABBITMQ_ADMIN_PASSWORD: ci-rabbitmq-admin-password
          RABBITMQ_APP_PASSWORD: ci-rabbitmq-app-password
          MONGO_CHAT_PASSWORD: ci-mongodb-chat-password
          JWT_SECRET: ci-jwt-secret
        run: docker compose config --quiet

  java-tests:
    name: Test ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: auth-service
            path: services/auth-service
          - name: user-service
            path: services/user-service
          - name: startup-service
            path: services/startup-service
          - name: post-service
            path: services/post-service
          - name: notification-service
            path: services/notification-service
          - name: api-gateway
            path: infrastructure/api-gateway
          - name: config-server
            path: infrastructure/config-server

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: ${{ matrix.path }}/pom.xml

      - name: Run Maven tests
        working-directory: ${{ matrix.path }}
        run: bash ./mvnw --batch-mode test

  frontend-checks:
    name: Check frontend
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Check TypeScript
        working-directory: frontend
        run: npm run type-check 2&>1 | tee tsc-report.txt 
        continue-on-error: true

      - name: Check formatting(report only)
        working-directory: frontend
        run: npm run fm:check 2&>1 | tee format-report.txt
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        if: always() 
        with:
          name: frontend-reports
          path: |
            frontend/tsc-report.txt
            frontend/format-report.txt
# always() here means even after failures it should save the artifacts,
# we mostly need it to have the reports and to read them to understand what happened
  chat-service-checks:
    name: Check chat-service dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: services/chat-service/package-lock.json

      - name: Install chat-service dependencies
        working-directory: services/chat-service
        run: npm ci

      - name: Run chat-service tests when available
        working-directory: services/chat-service
        run: npm run test --if-present
