ignored:
  # DL3066: "Non-numeric user-id may not be resolvable by host system"
  #
  # All nine Dockerfiles already pin a fixed numeric UID/GID (10001) on the
  # account via `addgroup -g 10001` / `adduser -u 10001`, so the UID is
  # deterministic and matches what Kubernetes' runAsUser/runAsNonRoot will
  # check in step 6. We keep `USER appuser` (the name) instead of
  # `USER 10001` (the number) because the name is what shows up in
  # `docker exec`, `docker top`, and container logs, which is easier to
  # read during local debugging. The underlying UID is fixed either way.
  - DL3066
